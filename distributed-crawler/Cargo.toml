[package]
name = "distributed-crawler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "crawl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
redis = { version = "1.7.1", features = ["tokio-comp"] }
reqwest = "0.13.5"
scraper = "0.27.0"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
